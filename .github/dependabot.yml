version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Kotlin, KMP and the Compose compiler plugin must move together.
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx:kotlinx-coroutines*"]
      androidx:
        patterns: ["androidx.*"]
      agp:
        patterns: ["com.android.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
