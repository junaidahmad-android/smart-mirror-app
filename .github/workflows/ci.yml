name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  # Gradle's daemon JVM is pinned to JDK 21 (gradle/gradle-daemon-jvm.properties); the launcher
  # JDK from setup-java below satisfies it, so no toolchain download is needed.
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  shared-and-android-unit:
    name: Shared + Android unit, lint, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests, debug APK, Android lint
        run: scripts/ci/unit.sh
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: |
            sharedLogic/build/reports/tests/
            sharedLogic/build/test-results/
            androidApp/build/reports/tests/
            androidApp/build/test-results/
            androidApp/build/reports/lint-results-*.html
            androidApp/build/reports/lint-results-*.xml
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  privacy-guard:
    name: Privacy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      # Android: merged RELEASE manifest has no INTERNET / ACCESS_NETWORK_STATE.
      # iOS: PrivacyInfo.xcprivacy exists in the sources (the `ios` job also checks the built bundle).
      - name: Check network permissions and privacy manifest
        run: scripts/ci/privacy-guard.sh
      - name: Upload merged release manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merged-release-manifest
          path: androidApp/build/intermediates/merged_manifest/release/**/AndroidManifest.xml
          if-no-files-found: ignore

  android-instrumented:
    name: Android instrumented (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Phone on every run; the tablet profile only on pushes to main (it doubles emulator time).
        device: ${{ fromJSON(github.event_name == 'pull_request' && '["phone"]' || '["phone","tablet"]') }}
    env:
      # Pinned: google_apis x86_64 images for API 35 are published and stable on hosted runners.
      API_LEVEL: 35
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      EMULATOR_PROFILE: ${{ matrix.device == 'tablet' && 'pixel_tablet' || 'pixel_6' }}
      # The E2E tests need the emulated front camera (CameraX); software GPU on hosted runners.
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back none
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build app and test APKs (before booting the emulator)
        run: scripts/ci/_gradle.sh :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}-v1
      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Connected tests (orchestrator + clearPackageData, no automatic retries)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: scripts/ci/android-connected.sh
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-reports-${{ matrix.device }}
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
          if-no-files-found: warn

  ios:
    name: iOS (shared K/N tests + XCTest + XCUITest)
    runs-on: macos-26
    timeout-minutes: 75
    env:
      XCODE_VERSION: "26.6"
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Kotlin/Native cache (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Tests on a dynamically resolved simulator (signing disabled) + bundle privacy check
        run: scripts/ci/ios-test.sh
      - name: Upload xcresult and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            build/ios/TestResults.xcresult
            build/ios/xcodebuild-test.log
            sharedLogic/build/reports/tests/
          if-no-files-found: warn
